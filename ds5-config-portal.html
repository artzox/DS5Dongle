                 : !c.acc && !c.dcd ? 'the wake request was refused and no fallback ran'
                 : !c.resumed  ? 'the wake signal was sent but the PC never came back'
                 : c.hidTo     ? 'the PC came back but its keyboard channel never opened, so the wake keypress could not be sent'
                 : !c.key      ? 'the PC came back but the wake keypress was not sent'
                 : 'the wake keypress was delivered — this sleep looks successful';
      h += `<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--line,#333)">`
        + `<b style="font-size:12px">Most recent sleep</b>`
        + `<table style="font-size:12px"><tr><td style="padding-right:10px">Wake requests during it</td><td>${c.req} (${c.acc} accepted${c.dcd?`, ${c.dcd} forced`:''})</td></tr>`
        + `<tr><td>Resume pulses re-sent</td><td>${c.reiss}</td></tr>`
        + `<tr><td>PC came back</td><td><b>${c.resumed ? 'yes' : 'NO'}</b></td></tr>`
        + `<tr><td>Wake keypress sent</td><td><b>${c.key ? 'yes' : 'no'}</b>${c.hidTo ? ' — keyboard channel never opened' : (c.hidWait ? ' (waited for the keyboard channel)' : '')}</td></tr></table>`
        + `<div style="margin-top:4px;font-size:11px;color:#e0a030">Where it got to: ${step}.</div></div>`;
    }
    h += `<div style="margin-top:6px;font-size:11px;color:var(--sub)">Totals reset when the dongle loses power, and include button presses made while awake. The <b>Most recent sleep</b> block is the one to read after a failed wake.</div>`;
    if (box) box.innerHTML = h;
  } catch(e){
    if (box) box.innerHTML = `<span style="color:#e0a030">Read failed: ${e && e.message ? e.message : e}</span>`;
  }
}

async function ceReadTrigger(trig){
  const name = trig === 0 ? 'R2' : 'L2';
  const pfx  = trig === 0 ? 'ce_r2' : 'ce_l2';
  const box  = document.getElementById('ce_readout');
  if (box) box.innerHTML = `Reading ${name}…`;
  try {
    const n = Math.min(5, +config[pfx + '_state_count'] || 0);
    const on = +config[pfx + '_enable'] || 0;
    if (!n){
      if (box) box.innerHTML = `<b>${name}</b>: no custom effect assigned.`;
      return;
    }
    const states = [];
    await hidLocked(async () => {
      for (let i = 0; i < n; i++){
        await sendCmd(0x12, [trig, i]);
        const r = await readCmdReplyOn(SLOT_REPORT, 0x12, undefined, 12);
        if (!r || r[2] !== 0x00) throw new Error('device did not return state ' + i);
        states.push({ bytes: Array.from(r.slice(5, 16)), dt: r[16] | (r[17] << 8) });
      }
    });
    const bytes = states.map(s => s.bytes);
    const anyMech = bytes.some(ceIsMechBytes);
    const mode = bytes.length === 1 ? 'single state'
               : anyMech ? 'mechanical sequence — ordered by trigger position, durations ignored'
                         : 'time-based — driven by the recorded durations';
    const win = ceActiveWindows(bytes);
    const COND = ['While held','On press','On release'];
    const YIELD = ['custom effect always owns it','sliders while gated, custom otherwise','custom while gated, sliders otherwise'];
    let h = `<div style="margin-bottom:6px"><b>${name}</b> — ${bytes.length} state${bytes.length===1?'':'s'}, `
          + `${on ? 'enabled' : '<span style="color:#e0a030">assigned but DISABLED</span>'}`
          + ` · ${COND[+config[pfx+'_condition']||0]} · re-arm zone ${+config[pfx+'_thresh']||0}`
          + ` · ${YIELD[+config[pfx+'_yield']||0]}</div>`
          + `<div style="margin-bottom:6px;color:var(--sub)">Playback: ${mode}</div>`;
    states.forEach((st,i) => {
      const w = win && win[i];
      const where = w ? ` <span style="color:var(--sub)">(stage ${w.order}, active pos ${w.from}–${w.to})</span>`
                      : (!anyMech && bytes.length > 1 ? ` <span style="color:var(--sub)">(${st.dt} ms)</span>` : '');
      h += `<div style="margin:3px 0">${i+1}. ${ceDescribeState(st.bytes)}${where}<br>`
        +  `<code style="font-size:11px;color:var(--sub)">${st.bytes.map(x=>x.toString(16).padStart(2,'0')).join(' ')}</code></div>`;
    });
    if (win){
      const cut = states.map((st,i) => ({st,i,w:win[i]}))
        .filter(x => x.w && ceIsMechBytes(x.st.bytes) &&
                     x.w.to < ceZpos(ceZonesOfBytes(x.st.bytes).slice(-1)[0]));
      if (cut.length) h += `<div style="margin-top:6px;font-size:11px;color:#e0a030">⚠ `
        + cut.map(x => `state ${x.i+1} is handed over at pos ${x.w.to}, before its own span ends at `
                     + `${ceZpos(ceZonesOfBytes(x.st.bytes).slice(-1)[0])}`).join('; ')
        + ` — its ending (a wall breaking, a bow snapping) will not be reached.</div>`;
    }
    if (box) box.innerHTML = h;
  } catch(e){
    if (box) box.innerHTML = `<span style="color:#e0a030">Read failed: ${e && e.message ? e.message : e}</span>`;
  }
}

// Export the effect currently assigned to a trigger, read back from the device.
// Profile exports carry only the 85 scalar settings, so an assigned effect could
// be enabled in a profile yet impossible to get back out as a file - this is the
// way to recover one after the fact.
async function exportEffectFile(trig){
  const name = trig === 0 ? 'R2' : 'L2';
  const pfx  = trig === 0 ? 'ce_r2' : 'ce_l2';
  const n = Math.min(5, +config[pfx + '_state_count'] || 0);
  if (!n){ alert(`No custom effect is assigned to ${name}.`); return; }
  try {
    const states = [];
    await hidLocked(async () => {
      for (let i = 0; i < n; i++){
        await sendCmd(0x12, [trig, i]);
        const r = await readCmdReplyOn(SLOT_REPORT, 0x12, undefined, 12);
        if (!r || r[2] !== 0x00) throw new Error('device did not return state ' + i);
        states.push({ bytes: Array.from(r.slice(5, 16)), dt: r[16] | (r[17] << 8) });
      }
    });
    const dump = { format: 'ds5dongle-custom-effect', version: 2, source: name,
      state_count: states.length,
      states: states.map(st => ({ type: '0x' + st.bytes[0].toString(16).padStart(2,'0'),
        name: effectTypeName(st.bytes[0]), bytes: st.bytes, duration_ms: st.dt })) };
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ds5-effect-${name.toLowerCase()}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch(e){ alert('Export failed: ' + (e && e.message ? e.message : e)); }
}

function cebSaveFile(){
  const list = window._cebStages;
  if (!list.length){ alert('Add at least one stage first.'); return; }
  const sorted = list.slice().sort((a, b) => cebStartZone(a.bytes) - cebStartZone(b.bytes));
  const dump = { format: 'ds5dongle-custom-effect', version: 2, source: 'built',
    state_count: sorted.length,
    states: sorted.map(st => ({ type: '0x' + st.bytes[0].toString(16).padStart(2, '0'),
      name: effectTypeName(st.bytes[0]), bytes: st.bytes, duration_ms: 0 })) };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ds5-built-effect-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// Load a custom-effect file and write it to a trigger.
async function loadCustomFile(event, trig){
  const file = event.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.format !== 'ds5dongle-custom-effect') throw new Error('not a custom-effect file');
    if (!data.states || !data.states.length) throw new Error('no states in file');
    // Same guard as the monitor and timeline assign paths: a saved file is just a
    // capture someone ticked, so it can carry the same state twice (the game
    // returning to it) or two stages starting at the same trigger position.
    let states = data.states;
    {
      const v = ceValidateStates(states, st => st.bytes);
      if (v.clash !== null){ alert(CE_ZONE_CLASH_MSG(v.clash)); return; }
      if (v.dropped.length){
        states = v.kept;
        alert(`${v.dropped.length} state${v.dropped.length===1?'':'s'} in this file ${v.dropped.length===1?'was an exact repeat':'were exact repeats'} of another — the game returning to a state it had already used, not a separate effect. Loading ${states.length} instead.`);
      }
    }
    const n = Math.min(5, states.length);
    await hidLocked(async () => {
      for (let s = 0; s < n; s++){
        const st = states[s];
        const t = st.bytes[0];
        const mech = (t===0x21||t===0x01||t===0x25||t===0x23||t===0x22||t===0x02); // bow is a force effect too
        // mechanical states never timeline-play - durations are game-state timing
        const dt = mech ? 0 : Math.min(65535, (st.duration_ms|0) || 0);
        await sendCmd(0x11, [trig, s, ...st.bytes, dt & 0xFF, (dt >> 8) & 0xFF]);
        await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
      }
      const base = trig === 0 ? 0x57 : 0x5c;
      await sendCmd(0x01, [base + 0, 1]);   // field write = cmd 0x01 + id
      await sendCmd(0x01, [base + 4, n]);
    });
    const pfx = trig === 0 ? 'ce_r2' : 'ce_l2';
    config[pfx + '_enable'] = 1;
    config[pfx + '_state_count'] = n;
    (window._dirty = window._dirty || {})[pfx + '_enable'] = 1;
    window._dirty[pfx + '_state_count'] = 1;
    render();
    alert(`Loaded ${n}-state custom effect onto ${trig===0?'R2':'L2'} (state count auto-set). Configure and Save to a slot.`);
  } catch(e){ alert('Load failed: ' + (e && e.message ? e.message : e)); }
  event.target.value = '';
}

// Back up ALL slots to one JSON file: names + every field value per valid slot.
// Read one custom-effect state out of a SLOT (fw cmd 0x15). The raw effect bytes
// are arrays inside the slot body, so the field-by-field export can't reach them -
// without this a slot backup silently lost every custom effect.
async function slotReadEffect(slot, trig, idx){
  await sendCmd(0x15, [slot, trig, idx]);
  const r = await readCmdReplyOn(SLOT_REPORT, 0x15, undefined, 12);
  if (!r || r[2] !== 0x00) return null;
  const bytes = Array.from(r.slice(8, 19));
  if (!bytes.some(b => b !== 0)) return null;        // empty state
  return { bytes, duration_ms: r[6] | (r[7] << 8) };
}

async function backupAllSlots(){
  const status = document.getElementById('backupStatus');
  const setS = t => { if (status) status.textContent = t; };
  const dump = { format: 'ds5dongle-slots', version: 2, savedAt: new Date().toISOString(), slots: [] };
  try {
    await hidLocked(async () => {
      for (let i = 0; i < UI_SLOT_COUNT; i++){
        setS(`Reading slot ${i+1}/${UI_SLOT_COUNT}…`);
        const info = await slotInfo(i);
        if (!info || !info.valid){ dump.slots.push({ index: i, valid: false }); continue; }
        const fields = {};
        for (const f of FIELDS){
          const v = await slotReadField(i, f);
          if (v !== null) fields[f[1]] = v;
        }
        // raw custom-effect states (not reachable as fields)
        const effects = {};
        for (const [trig, key] of [[0,'r2'],[1,'l2']]){
          const list = [];
          for (let n = 0; n < 5; n++){
            const e = await slotReadEffect(i, trig, n);
            if (e) list.push(e); else break;
          }
          if (list.length) effects[key] = list;
        }
        dump.slots.push({ index: i, valid: true, name: info.name, cfgVersion: info.cfgVersion,
                          fields, ...(Object.keys(effects).length ? { effects } : {}) });
      }
    });
    const validN = dump.slots.filter(s => s.valid).length;
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = URL.createObjectURL(blob); a.download = `ds5dongle-slots-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setS(`Backed up ${validN} slot${validN===1?'':'s'} \u2713`);
  } catch(e){ setS('Backup failed: ' + (e && e.message ? e.message : e)); }
}

// Restore ALL slots from a backup file: for each valid slot, bulk-write its
// fields into the ACTIVE config, then save that into the slot. Empty slots in
// the file are left untouched on the dongle (non-destructive to slots the backup
// didn't cover). The active config is disturbed during restore, so we reload it
// afterward.
async function restoreAllSlots(file){
  const status = document.getElementById('backupStatus');
  const setS = t => { if (status) status.textContent = t; };
  let dump;
  try { dump = JSON.parse(await file.text()); }
  catch { setS('Restore failed: not a valid JSON file'); return; }
  if (!dump || dump.format !== 'ds5dongle-slots' || !Array.isArray(dump.slots)){
    setS('Restore failed: not a DS5Dongle slot backup'); return;
  }
  const valid = dump.slots.filter(s => s.valid && s.fields);
  if (!valid.length){ setS('Nothing to restore (backup has no saved slots)'); return; }
  if (!confirm(`Restore ${valid.length} slot(s) from this file? Each listed slot on the dongle will be overwritten.`)) { setS('Restore cancelled'); return; }
  const byKey = Object.fromEntries(FIELDS.map(f => [f[1], f]));
  let done = 0, failed = 0;
  try {
    await hidLocked(async () => {
      for (const s of valid){
        setS(`Restoring slot ${s.index+1}…`);
        const entries = [];
        for (const [key, value] of Object.entries(s.fields)){
          const f = byKey[key]; if (!f) continue;         // unknown field (newer/older backup) - skip
          entries.push({ fid: f[0], type: f[2], value });
        }
        const wrote = await bulkWriteFields(entries);
        if (!wrote){ failed++; continue; }
        // Raw effect states go into the live config first; slot_save snapshots the
        // whole body, so they land in the slot with everything else.
        if (s.effects){
          for (const [trig, key] of [[0,'r2'],[1,'l2']]){
            const list = s.effects[key] || [];
            for (let n = 0; n < Math.min(5, list.length); n++){
              const dt = Math.min(65535, (list[n].duration_ms|0) || 0);
              await sendCmd(0x11, [trig, n, ...list[n].bytes, dt & 0xFF, (dt >> 8) & 0xFF]);
              await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
            }
          }
        }
        const saved = await slotSave(s.index, s.name || '');
        if (saved) done++; else failed++;
      }
    });
    await readAll(); render(); await refreshSlots();
    setS(`Restored ${done} slot${done===1?'':'s'}${failed?`, ${failed} failed`:''} \u2713`);
  } catch(e){ setS('Restore failed: ' + (e && e.message ? e.message : e)); }
}

async function rebootBootloader(){
  if(!device || !device.opened){ toast('Connect first', true); return; }
  if(!confirm('Reboot the dongle into the bootloader (RPI-RP2 drive) for reflashing?\n\nThe controller disconnects. Drag a .uf2 onto the drive to flash, or replug to cancel.')) return;
  try { await sendCmd(0x07); } catch(e){ /* device vanishes, expected */ }
  toast('Rebooting to bootloader — look for RPI-RP2 drive');
}

async function reacquire(){
  // Force a fresh device handle from getDevices(). After a reconnect cycle the
  // previous object can report opened while its connection is dead, so writes
  // silently fail; re-acquiring a fresh handle is the reliable recovery.
  try { if (device && device.opened) await device.close(); } catch(e){}
  device = null;
  for (let i = 0; i < 10; i++){
    try {
      const devs = await navigator.hid.getDevices();
      const d = pickDs5(devs);
      if (d){
        device = d;
        if (!device.opened) await device.open();
        return true;
      }
    } catch(e){}
    await sleep(250);
  }
  return false;
}

async function ensureDevice(){
  // The disconnect event listener nulls `device` when the controller goes away,
  // so a stale handle won't survive a disconnect/reconnect. If we still hold an
  // opened handle, trust it; otherwise re-acquire.
  if (device && device.opened) return true;
  return await reacquire();
}

// Write a field; if the handle is stale (write throws), re-acquire once and retry.
async function writeFieldSafe(fid, type, value){
  try {
    await writeField(fid, type, value);
  } catch(e){
    if (await reacquire()) {
      await writeField(fid, type, value); // retry on the fresh handle
    } else {
      throw e;
    }
  }
}

// --- Profile export/import ---
// A profile is a JSON object of {field_name: value} for every known field, plus a
// small wrapper with a name and version. (An earlier note here promised a
// ds5profile CLI; no such tool was ever shipped, so the note was removed rather
// than left pointing at something that does not exist.)
// CLI helper (for Playnite auto-apply), so keep the field names in sync with FIELDS.
// Effects are raw state ARRAYS on the device, not numbered settings, so they are
// invisible to the field-by-field profile export. These two helpers move them in
// and out so a profile (and an auto-apply HTML) is a complete snapshot: without
// them a profile could record that a trigger HAS a custom effect while carrying
// nothing to recreate it.  Call inside hidLocked().
async function readEffectsFromDevice(){
  const out = {};
  for (const [trig,key] of [[0,'r2'],[1,'l2']]){
    const n = Math.min(5, +config[(trig===0?'ce_r2':'ce_l2') + '_state_count'] || 0);
    const list = [];
    for (let i = 0; i < n; i++){
      await sendCmd(0x12, [trig, i]);
      const r = await readCmdReplyOn(SLOT_REPORT, 0x12, undefined, 12);
      if (!r || r[2] !== 0x00) break;
      const bytes = Array.from(r.slice(5, 16));
      if (!bytes.some(b => b !== 0)) break;
      list.push({ bytes, duration_ms: r[16] | (r[17] << 8) });
    }
    if (list.length) out[key] = list;
  }
  return out;
}
async function writeEffectsToDevice(effects){
  if (!effects) return 0;
  let n = 0;
  for (const [trig,key] of [[0,'r2'],[1,'l2']]){
    let list = effects[key] || [];
    if (!list.length) continue;
    // A profile or backup can carry a set that was captured with the same state
    // twice. Drop exact repeats and correct the stored count to match, so a
    // restore can't silently reinstate a set that falls back to A/B cycling.
    const v = ceValidateStates(list, st => st.bytes);
    if (v.dropped.length){
      list = v.kept;
      const base = trig === 0 ? 0x57 : 0x5c;
      await sendCmd(0x01, [base + 4, Math.min(5, list.length)]);
      const pfx = trig === 0 ? 'ce_r2' : 'ce_l2';
      config[pfx + '_state_count'] = Math.min(5, list.length);
    }
    for (let i = 0; i < Math.min(5, list.length); i++){
      const dt = Math.min(65535, (list[i].duration_ms|0) || 0);
      await sendCmd(0x11, [trig, i, ...list[i].bytes, dt & 0xFF, (dt >> 8) & 0xFF]);
      await readCmdReplyOn(SLOT_REPORT, 0x11, undefined, 12);
      n++;
    }
  }
  return n;
}

async function exportProfile(){
  const settings = {};
  for (const [fid,key] of FIELDS){ settings[key] = config[key] ?? 0; }
  let effects = null;
  try { effects = await hidLocked(() => readEffectsFromDevice()); } catch(e){ effects = null; }
  const profile = {
    name: 'ds5dongle-profile',
    version: 2,
    note: 'DS5Dongle profile. Import it with the configuration portal.',
    settings,
    ...(effects && Object.keys(effects).length ? { effects } : {})
  };
  const blob = new Blob([JSON.stringify(profile, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ds5dongle-profile.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Profile exported' + (profile.effects ? ' (with custom effects)' : ''));
}

// Export a STANDALONE auto-applying HTML with the current settings baked in.
// Double-clicking the exported file silently reconnects to the dongle and applies
// + saves these settings — no Python, no separate generator, no URL params.
async function exportHtml(){
  const name = (prompt('Name this profile (used for the filename + banner):',
                       'DS5 Profile') || 'DS5 Profile').trim() || 'DS5 Profile';
  const settings = {};
  for (const [fid,key] of FIELDS){ settings[key] = config[key] ?? 0; }
  let hEffects = null;
  try { hEffects = await hidLocked(() => readEffectsFromDevice()); } catch(e){ hEffects = null; }
  const embedded = { name, version: 2, settings,
    ...(hEffects && Object.keys(hEffects).length ? { effects: hEffects } : {}) };

  // Get the portal's own source BYTE-EXACT by fetching the file itself, rather than
  // document.documentElement.outerHTML (which the browser may re-normalize —
  // changing whitespace/comments so the embed hook is no longer found). fetch on a
  // file:// page returns the raw bytes on disk, which contain the hook verbatim.
  let html;
  try {
    const resp = await fetch(location.href);
    html = await resp.text();
  } catch(e){
    // Some browsers block fetch of local files; fall back to outerHTML.
    html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  }
  // Safe JSON for an inline script (avoid accidentally closing the script tag).
  const embedJs = JSON.stringify(embedded).replace(/<\//g, '<\\/');
  // Match the hook specifically: it sits at the start of a line (column 0), whereas
  // this code below is indented — so a multiline ^-anchored match hits only the real
  // hook, never this line.
  const re = /^const EMBEDDED_PROFILE = null;/m;
  if (!re.test(html)){
    toast('Export HTML failed: embed hook not found. Make sure you opened THIS portal '
          + 'file (not a generated copy).', true);
    return;
  }
  html = html.replace(re, 'const EMBEDDED_PROFILE = ' + embedJs + ';');

  const safe = name.replace(/[^\w.-]+/g, '_');
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = safe + '.autoapply.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported ' + safe + '.autoapply.html — open it to auto-apply this profile');
}

function importProfile(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      let data = JSON.parse(reader.result);
      // Accept either a bare {field:value} object or a {settings:{...}} wrapper.
      const settings = (data && typeof data.settings === 'object') ? data.settings : data;
      let applied = 0, unknown = [];
      const known = new Set(FIELDS.map(f => f[1]));
      for (const k of Object.keys(settings)){
        if (known.has(k)){ config[k] = settings[k]; applied++; }
        else unknown.push(k);
      }
      render();
      let extra = '';
      if (data && data.effects){
        try {
          const n = await hidLocked(() => writeEffectsToDevice(data.effects));
          extra = ` + ${n} effect state(s) applied`;
        } catch(e){ extra = ' (custom effects need a connected device — connect and re-import)'; }
      }
      toast(`Imported ${applied} setting(s)` + (unknown.length?` (ignored ${unknown.length} unknown)`:'') + extra + ' — click Save to Device to apply');
    }catch(e){
      toast('Import failed: not a valid profile JSON', true);
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // allow re-importing the same file
}

async function saveAll(){
  try{
    saving = true; // pause background diagnostic polling so it can't collide
                   // with the save's reads/writes or the close/reopen cycle
    if (!(await ensureDevice())){ toast('No device — click Connect', true); return; }
    // Use writeFieldSafe so a stale handle (after a prior reconnect) is detected
    // on the first write and recovered, instead of silently failing.
    const failedFields = [];
    let bulkDone = false;
    if (bulkSupported !== false){
      try {
        bulkDone = await bulkWriteFields(FIELDS.map(([fid,key,type]) => ({fid, type, value: config[key] ?? 0})));
        if (bulkDone) bulkSupported = true;
      } catch(_){ bulkDone = false; }
      if (!bulkDone && bulkSupported === null) bulkSupported = false;
    }
    if (!bulkDone) for (const [fid,key,type] of FIELDS){
      let ok = false;
      for (let a = 0; a < 2 && !ok; a++){
        try { await writeFieldSafe(fid, type, config[key] ?? 0); ok = true; }
        catch(e){ if (a) failedFields.push(key); else await sleep(150); } // one retry per field
      }
    }
    if (failedFields.length) toast('Some fields failed to write: ' + failedFields.join(', '), true);
    try { await sendCmd(0x02); }
    catch(e){ try { if (await reacquire()) await sendCmd(0x02); } catch(_){ /* the first attempt often landed despite the host-side throw (USB stalls during the flash write) */ } }

    // Only a few fields require a USB re-enumeration to take effect (polling rate,
    // audio buffer length, mic/speaker enable). Everything else (auto-haptics,
    // effect leak, mute, lightbar, volumes) applies live on save. So only trigger
    // a reconnect when one of those enumeration-time fields actually changed —
    // this avoids an unnecessary disconnect/reconnect on every save.
    const ENUM_FIELDS = ['controller_mode','polling_rate_mode','audio_buffer_length','disable_mic','disable_speaker','enable_wake'];
    let needReconnect = false;
    for (const k of ENUM_FIELDS){
      if (savedSnapshot[k] !== config[k]) { needReconnect = true; break; }
    }

    if (!needReconnect){
      // No enumeration-time change — settings are already applied live. Just
      // confirm and refresh the snapshot. No reconnect, no handle churn.
      savedSnapshot = {...config};
      toast('Saved');
      return;
    }

    toast('Saved — reconnecting…');
    // A single reconnect: the firmware's 0x03 re-enumerates the USB device. We do
    // NOT separately close/open the WebHID handle (that would cause a SECOND
    // visible reconnect); instead we let the firmware reconnect, then re-acquire
    // the handle that the OS presents after re-enumeration.
    await sleep(300); // let flash write finish
    try { await sendCmd(0x03); } catch(e){ /* device drops here, expected */ }
    device = null; // drop our reference; the re-enumerated device is a new handle
    for (let attempt = 0; attempt < 12; attempt++){
      await sleep(500);
      try {
        const devs = await navigator.hid.getDevices();
        const d = pickDs5(devs);
        if (d){
          device = d;
          if (!device.opened) await device.open();
          await sleep(350);
          await readAll();
          savedSnapshot = {...config};
          render();
          toast('Reconnected — settings refreshed');
          return;
        }
      } catch(e){ /* keep trying */ }
    }
    render();
    toast('Saved. Click Connect to reconnect.', true);
  }catch(e){
    // Field writes and the flash save happen BEFORE the late stages that
    // usually throw (reconnect / read-back), so a blanket "Save failed" was
    // often false. Be accurate and point at verification.
    toast('Save hit an error - settings are likely saved anyway; use Re-read to verify. (' + e.message + ')', true);
  }
  finally { saving = false; } // always resume background polling
}


async function readDiag(){
  if(saving || !device || !device.opened) return {br:'-', ch:'-', rssi:null};
  try {
    const br = await readField(0x20, 'u16');
    const ch = await readField(0x21, 'u8');
    let rssi = await readField(0x22, 'u8');
    // RSSI is a signed int8 (dBm-ish, closer to 0 = stronger). Convert from u8.
    if (rssi > 127) rssi -= 256;
    let gy = null, sy = null, c01 = null, c23 = null;
    try { gy = await readField(0x35, 'u16'); sy = await readField(0x36, 'u8'); } catch(e) {}
    try { c01 = await readField(0x37, 'u16'); c23 = await readField(0x38, 'u16'); } catch(e) {}
    let ke = null;
    try { ke = await readField(0x3c, 'u8'); } catch(e) {}
    let rl = null, rr = null, rf = null;
    try { rl = await readField(0x3d, 'u8'); rr = await readField(0x3e, 'u8'); rf = await readField(0x3f, 'u8'); } catch(e) {}
    return {br, ch, rssi, gy, sy, c01, c23, ke, rl, rr, rf};
  } catch(e){ return {br:'err', ch:'err', rssi:null, gy:null, sy:null, c01:null, c23:null, ke:null, rl:null, rr:null, rf:null}; }
}
function rssiLabel(r){
  if (r === null || r === undefined) return 'n/a';
  // The Pico W radio (CYW43) reports Bluetooth Classic RSSI relative to a
  // "golden receive range", not absolute dBm: values near 0 mean the signal is
  // in the ideal range; larger magnitude (either sign) means it's drifting out
  // of that range. So small |r| = good link, large |r| = marginal.
  const mag = Math.abs(r);
  let q;
  if (mag <= 10) q = 'strong';
  else if (mag <= 20) q = 'good';
  else if (mag <= 30) q = 'fair';
  else q = 'weak';
  return `${r} (${q})`;
}
async function refreshDiag(){
  const d = await readDiag();
  const el = document.getElementById('diagbox');
  if(el){
    let extra = '';
    if (d.c01 !== null && d.c01 !== undefined)
      extra += `<br>Audio signal: ch0-1 (speaker/DSP source)=${d.c01}, ch2-3 (native actuators)=${d.c23}  (ch0-1 must be >0 for auto-haptics/effect-leak — if 0 here, the audio routing isn't putting game sound on those channels)`;
    if (d.gy !== null && d.gy !== undefined)
      extra += `<br>Gyro |raw| (horizontal): ${d.gy}  (0 = gyro off or controller still — wave it to calibrate sensitivity)`;
    if (d.sy !== null && d.sy !== undefined){
      const f = [];
      if (d.sy & 1)  f.push('game-owns-L2');
      if (d.sy & 2)  f.push('game-owns-R2');
      if (d.sy & 4)  f.push('synth-L2');
      if (d.sy & 8)  f.push('synth-R2');
      if (d.sy & 16) f.push('AT-engaged');
      if (d.sy & 32) f.push('KICK');
      extra += `<br>Trigger synthesis: ${f.length ? f.join(' · ') : 'idle'}  (game-owns = your r2t/at yield; use Force override to take over)`;
      if (d.ke !== null && d.ke !== undefined)
        extra += `<br>Push-back envelope: ${d.ke}/255  (must rise with rumble/gunfire while AT-engaged; kick fires at >=32 - if this stays 0 during rumble, the selected source isn't producing signal)`;
    }
    if (d.rl !== null && d.rl !== undefined) {
      const rq = [];
      if (d.rf & 1) rq.push('EnableRumbleEmulation');
      if (d.rf & 2) rq.push('UseRumbleNotHaptics');
      if (d.rf & 4) rq.push('Improved');
      extra += `<br>Rumble from host: peak L=${d.rl} R=${d.rr} since last read, requested: ${rq.length ? rq.join(' + ') : 'none'}  (peak-hold, so any burst in the last second registers. Non-zero = the game sends motor values, which Mix carries via Converted Rumble Strength. Zero while you feel vibration = it is delivered as haptic audio on ch3/4 instead, carried by Native Passthrough)`;
    }
    el.innerHTML = `Live audio stream: bytes_read=${d.br}, detected channels=${d.ch}  (4=native, 2=Windows/DS4Windows stereo)<br>Bluetooth signal: ${rssiLabel(d.rssi)}${extra}`;
  }
}
setInterval(()=>{ if(!saving && !slotsBusy && device && device.opened && document.getElementById('diagbox')) hidLocked(refreshDiag); }, 1000);

// ===== Tabbed navigation =====
// Sections keep their existing definitions; tabs are a RENDER-TIME partition, so
// no field entry moves and no binding changes. Custom-effect fields (ce_*) live
// inside the per-trigger sections but are shown on the Custom Effects tab, so
// everything about an effect sits together.
const SECTION_TAB = {
  'Adaptive Triggers — R2 (right trigger)':'triggers',
  'Adaptive Triggers — L2 (left trigger)':'triggers',
  'Rumble → Trigger':'triggers',
  'Auto-Haptics & Speaker Effect Leak':'haptics',
  'General Haptics & Audio':'haptics',
  'Native Haptics Filter':'haptics',
  'Gyro Aiming':'gyro',
  'Device & Connection':'device',
  'Advanced — BT Latency (experimental)':'device',
};
// Order: connection first, then the feature areas, with Slots (where you save
// what you just set up) last. Custom effects are NOT a separate tab: every
// custom effect is a TRIGGER effect, and its settings cross-reference the
// resistance mode on the same trigger (the gate hand-off warning names it), so
// splitting them put a warning on one tab and its fix on another.
const TABS = [
  {id:'device',   label:'Device'},
  {id:'haptics',  label:'Haptics'},
  {id:'triggers', label:'Triggers'},
  {id:'gyro',     label:'Gyro'},
  {id:'slots',    label:'Slots'},
];
window._tab = window._tab || 'triggers';
function setTab(id){ window._tab = id; render(); }

// Startup self-check. This portal is one large hand-edited file and several
// regressions were invisible: a field silently not rendered, an event attribute
// broken by an embedded quote, a panel showing a placeholder while its data
// still lived in memory. Fail loudly at load instead.
function portalSelfCheck(){
  const problems = [];
  const seen = new Map();
  for (const sec of SECTIONS){
    if (!(sec.title in SECTION_TAB)) problems.push(`section "${sec.title}" is not assigned to a tab`);
    for (const [fid,key] of sec.fields){
      if (seen.has(key)) problems.push(`field key "${key}" appears twice`);
      seen.set(key, fid);
    }
  }
  const ids = new Map();
  for (const [fid,key] of FIELDS){
    if (ids.has(fid) && ids.get(fid) !== key)
      problems.push(`field id 0x${fid.toString(16)} used by both "${ids.get(fid)}" and "${key}"`);
    ids.set(fid, key);
  }
  // every section must land on a tab that exists
  for (const sec of SECTIONS){
    const tab = SECTION_TAB[sec.title];
    if (!TABS.some(t => t.id === tab))
      problems.push(`section "${sec.title}" maps to unknown tab "${tab}"`);
  }
  if (problems.length){
    console.error('PORTAL SELF-CHECK FAILED:\n' + problems.join('\n'));
    const b = document.createElement('div');
    b.style.cssText = 'background:#5a1b1b;color:#ffd9d9;padding:8px 12px;font:12px system-ui;white-space:pre-wrap';
    b.textContent = 'Portal self-check failed — some settings may be unreachable:\n' + problems.join('\n');
    document.body.prepend(b);
  }
  return problems.length === 0;
}

// A gate hand-off is only useful if BOTH halves have something armed. The custom
// side always does; the slider side only plays where its resistance mode is armed.
// Rather than silently rewriting a resistance mode the user chose, flag the
// combination and name the setting to change.
function ceGateWarning(key){
  const isR2 = key === 'ce_r2_yield';
  const y = +config[isR2 ? 'ce_r2_yield' : 'ce_l2_yield'] || 0;
  const en = +config[isR2 ? 'ce_r2_enable' : 'ce_l2_enable'] || 0;
  if (!en || !y) return '';
  const mode = +config[isR2 ? 'at_mode' : 'at_l2_mode'] || 0;
  const T = isR2 ? 'R2' : 'L2';
  const resLabel = `${T} resistance mode`;
  if (y === 2 && mode !== 2)
    return `Set <b>${resLabel}</b> to <b>always on</b>, or the ungated half is silent: the custom effect covers ${T} while the gate is held, and nothing is armed to cover it the rest of the time.`;
  if (y === 1 && mode === 0)
    return `<b>${resLabel}</b> is off, so the gated half is silent — the custom effect covers ${T} while the gate is open, but there is no slider effect to hand over to while it is held.`;
  return '';
}

// Sub-dividers inside a section: a bold labelled rule emitted BEFORE the named
// field, to visually split a long card into its distinct halves. Keyed by field
// so it survives fields being reordered around it.
const SUB_DIVIDERS = {
  // bold: true  -> the heavy rule used to split a long card in half
  // otherwise   -> the subtle rule, matching the "Shared by both triggers"
  //                separator above Kick follows
  'effect_leak_volume': { label: 'Speaker Effect Leak', bold: true },
  'ce_r2_enable':       { label: 'Custom captured effect' },
  'ce_l2_enable':       { label: 'Custom captured effect' },
};

// One settings row. Extracted from render() so the side-by-side trigger view can
// place identical markup into grid cells without duplicating any of it.
function fieldRowHTML(f){
  const [fid,key,type,label,kind,opts] = f;
  let html = '';
  const _d = SUB_DIVIDERS[key];
  if (_d) html += `<div class="${_d.bold ? 'subdiv' : 'subdiv-light'}">${_d.label}</div>`;
  html += `<div class="row"><div><div class="label">${label}</div></div><div>`;
  if(kind==='bool'){
    html += `<select onchange="config['${key}']=+this.value;(window._dirty=window._dirty||{})['${key}']=1">
      <option value="0" ${config[key]==0?'selected':''}>No</option>
      <option value="1" ${config[key]==1?'selected':''}>Yes</option></select>`;
  } else if(kind==='select'){
    // NOTE: never embed a JSON array here - its double quotes close the onchange
    // attribute and silently break EVERY select in the portal. Decide the
    // re-render here and emit only a bare call.
    const reRender = ['ce_r2_yield','ce_l2_yield','at_mode','at_l2_mode','ce_r2_enable','ce_l2_enable'].includes(key);
    html += `<select onchange="config['${key}']=+this.value;(window._dirty=window._dirty||{})['${key}']=1${reRender?';render()':''}">`;
    { const pairs = Array.isArray(opts) ? opts : Object.entries(opts); for(const [v,lbl] of pairs) html += `<option value="${v}" ${config[key]==v?'selected':''}>${lbl}</option>`; }
    html += `</select>`;
  } else {
    const [min,max]=opts;
    const step = (type==='f32') ? '0.05' : '1';
    const val = (config[key]??0);
    const shown = (type==='f32') ? Number(val).toFixed(2) : val;
    html += `<input type="number" min="${min}" max="${max}" step="${step}" value="${shown}" onchange="config['${key}']=${type==='f32'?'parseFloat(this.value)':'+this.value'};(window._dirty=window._dirty||{})['${key}']=1">`;
  }
  html += `</div></div>`;
  if(key === 'ce_r2_yield' || key === 'ce_l2_yield'){
    const w = ceGateWarning(key);
    if(w) html += `<div class="row" style="padding-top:0"><div></div><div style="font-size:11px;color:#e0a030;line-height:1.35">⚠ ${w}</div></div>`;
  }
  return html;
}

// R2 and L2 side by side. The two lists are otherwise identical in content and
// order, so pairing them by their shared logical key keeps every row aligned -
// a CSS grid sizes each row to its tallest cell, so a label that wraps on one
// side can't make the columns drift apart. "Kick follows" is the one field that
// is SHARED by both triggers (it lives in the R2 list only), so it is lifted out
// to a full-width row beneath rather than left dangling in one column.
const R2_TITLE = 'Adaptive Triggers — R2 (right trigger)';
const L2_TITLE = 'Adaptive Triggers — L2 (left trigger)';
const SHARED_TRIGGER_KEYS = new Set(['at_pushback_src']);
const trigLogical = k => k.replace('at_l2_','at_').replace('ce_l2_','ce_').replace('ce_r2_','ce_');
function triggerPairHTML(){
  const secOf = t => (SECTIONS.find(s => s.title === t) || {fields:[]}).fields;
  const r2 = secOf(R2_TITLE), l2 = secOf(L2_TITLE);
  const shared = [...r2, ...l2].filter(f => SHARED_TRIGGER_KEYS.has(f[1]));
  const l2map = new Map(l2.filter(f => !SHARED_TRIGGER_KEYS.has(f[1]))
                          .map(f => [trigLogical(f[1]), f]));
  const rows = [];
  for(const f of r2){
    if(SHARED_TRIGGER_KEYS.has(f[1])) continue;
    const lk = trigLogical(f[1]);
    rows.push([f, l2map.get(lk) || null]);
    l2map.delete(lk);
  }
  for(const f of l2map.values()) rows.push([null, f]);   // any L2-only field
  let h = `<div class="card"><div class="card-title">Adaptive Triggers</div>
    <div class="tpair">
      <div class="tcolhead">L2 — left trigger</div>
      <div class="tcolhead">R2 — right trigger</div>`;
  // L2 first: the columns mirror the controller, where L2 is the left trigger.
  for(const [a,b] of rows)
    h += `<div class="tcell">${b ? fieldRowHTML(b) : ''}</div><div class="tcell">${a ? fieldRowHTML(a) : ''}</div>`;
  h += `</div>`;
  if(shared.length){
    h += `<div class="tshared"><div style="font-size:11px;color:var(--sub);margin-bottom:2px">Shared by both triggers</div>`;
    for(const f of shared) h += fieldRowHTML(f);
    h += `</div>`;
  }
  return h + `</div>`;
}

function render(){

  let html = `<h1>DS5 Bridge Config <span style="font-size:13px;color:var(--sub)">v1.18.17</span></h1>

      <span style="flex:1">${on?`Connected — ${device.productId===DSE_PID?'DualSense Edge':'DualSense'}${fwVer?` · FW v${fwVer.maj}.${fwVer.min}.${fwVer.pat} · config v${fwVer.cfgv}`:` · FW: pre-1.0.5 (no version fields)`}`:'Not connected'}</span>
      <button class="btn ${on?'btn-outline':'btn-primary'}" onclick="${on?'disconnect()':'connect()'}">${on?'Disconnect':'Connect'}</button>

  for(const section of SECTIONS){
    if ((SECTION_TAB[section.title] || 'device') !== tab) continue;

    // Add calibration buttons for Gyro Aiming section

      `;

    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProfile(event)">
    <button class="btn btn-outline" onclick="rebootBootloader()">Reboot to Bootloader</button>
  </div>
  ` + (tab==='slots' ? `<div class="card"><div class="card-title">Profile Slots <span style="font-size:11px;color:var(--sub)">(stored on the dongle — fw 1.1.2+)</span></div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">Save the current settings into a numbered slot once; activating a slot later is a single instant command (used by the automation via slot-activate.html).</div>
    <div id="slotbox" style="font-size:13px">Connect to manage slots.</div></div>` : '') + `
  ` + (tab==='triggers' ? `<div class="card"><div class="card-title">Trigger Effect Monitor &amp; Custom Effects <span style="font-size:11px;color:var(--sub)">(capture real game effects)</span></div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">Captures genuine adaptive-trigger effects a game sends (resistance, weapon-break, vibration). Play the game, do the action, press Refresh. Tick the states that make up one action (up to 5), then <b>Assign</b>. Mechanical states (weapon-breaks, resistances) replay <b>positionally in sequence</b> along the pull — walls and resistances land at their captured trigger positions; vibration pairs blend at the rate slider. Configure the condition/threshold/rate in the trigger's Custom Effect fields above, then Save to a slot. <b>Note:</b> only real game-sent effects capture — firmware-converted rumble (e.g. Control) and DS4Windows/Xbox rumble do not, as those aren't trigger effects the game sent.</div>
    <button class="btn btn-outline" style="padding:2px 10px;margin-bottom:4px" onclick="refreshEffectMonitor()">Refresh captured effects</button>
    <span style="font-size:12px;color:var(--sub)"> · Load custom effect file → </span>
    <button class="btn btn-outline" style="padding:2px 8px" onclick="document.getElementById('ceFileL2').click()">L2</button>
    <button class="btn btn-outline" style="padding:2px 8px" onclick="document.getElementById('ceFileR2').click()">R2</button>

      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="tlRecordStart()">● Record</button>

      <div id="tlbox" style="font-size:13px;margin-top:6px;color:var(--sub)">Not recording.</div>
    </div></div>
  <div class="card"><div class="card-title">Build a Custom Effect <span style="font-size:11px;color:var(--sub)">(author stages by hand — no game capture needed)</span></div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">Add up to 5 stages. Mechanical stages (weapon breaks, resistances) are played <b>in sequence as you pull</b>, ordered by their start zone — so two walls at different depths give a genuine two-stage pull, which the trigger sliders can't do. A vibration stage can be mixed in and takes over at its own depth (it replaces the wall there — the controller plays one trigger effect at a time). Each stage needs a <b>different start zone</b>, and stages want <b>room between them</b> — a stage squeezed into one or two zones can be skipped by a normal pull. Zones are 0–9 ≈ 0–100% of the pull. Weapon-break limits: wall start 2–7, break point 3–8. Bow limits: draw start 0–7, draw end 1–8. Values outside those are clamped, and the list shows what was actually encoded. A <b>bow</b> builds resistance through the draw and then <b>pushes the trigger back</b> at the end — the one thing resistance and weapon break can't do. Put any vibration on a <b>later</b> stage — a vibration on the first stage buzzes at rest.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px">
      <select id="ceb_type" onchange="cebTypeChanged()">
        <option value="break">Weapon break (wall that gives way)</option>
        <option value="bow">Bow / snap (draws, then pushes back)</option>
        <option value="resistance">Resistance</option>
        <option value="vibration">Vibration</option>
      </select>
      <label>Start zone <input type="number" id="ceb_start" min="0" max="9" value="2" style="width:52px"></label>
      <label id="ceb_endlbl">Break zone <input type="number" id="ceb_end" min="0" max="9" value="5" style="width:52px"></label>
      <label id="ceb_strlbl">Strength % <input type="number" id="ceb_str" min="0" max="100" value="100" style="width:60px" oninput="cebShowLevels()"></label><span id="ceb_strlvl" style="font-size:11px;color:var(--sub)"></span>
      <label id="ceb_snaplbl" style="display:none">Snap force % <input type="number" id="ceb_snap" min="0" max="100" value="100" style="width:60px" oninput="cebShowLevels()"></label><span id="ceb_snaplvl" style="font-size:11px;color:var(--sub)"></span>
      <label id="ceb_freqlbl" style="display:none">Frequency <input type="number" id="ceb_freq" min="1" max="255" value="40" style="width:60px"></label>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebAddStage()">Add stage</button>
    </div>
    <div id="ceb_list" style="font-size:12px;margin-top:8px">No stages yet.</div>
    <div style="margin-top:6px">
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebAssign(1)">Assign → L2</button>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebAssign(0)">Assign → R2</button>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebSaveFile()">Save to file</button>
      <button class="btn btn-outline" style="padding:2px 10px" onclick="cebClear()">Clear list</button>
    </div>
    <div style="margin-top:8px;border-top:1px solid var(--line,#333);padding-top:6px">
      <span style="font-size:12px;color:var(--sub)">Remove the effect currently on a trigger — wipes its stored states and hands the trigger back to the sliders:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceClearDevice(1)">Remove effect from L2</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceClearDevice(0)">Remove effect from R2</button>
    </div>
    <div style="margin-top:8px;border-top:1px solid var(--line,#333);padding-top:6px">
      <span style="font-size:12px;color:var(--sub)">See what is actually on a trigger right now — decoded, with the position window each stage will get:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceReadTrigger(1)">Read L2</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="ceReadTrigger(0)">Read R2</button>
      <div id="ce_readout" style="font-size:12px;margin-top:6px">Nothing read yet.</div>
    </div>
    <div style="margin-top:8px;border-top:1px solid var(--line,#333);padding-top:6px">
      <span style="font-size:12px;color:var(--sub)">Save the effect currently on a trigger to a file (profile exports don't carry effect data):</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="exportEffectFile(1)">Export effect from L2</button>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="exportEffectFile(0)">Export effect from R2</button>
    </div></div>` : '') + `
  ` + (tab==='device' ? `<div class="card"><div class="card-title">Diagnostic</div>
    <div id="diagbox" style="font-size:12px;color:var(--sub)">Reading live stream…</div>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line,#333)">
      <span style="font-size:12px;color:var(--sub)">Wake troubleshooting — what the dongle observed across sleeps since it was powered up:</span><br>
      <button class="btn btn-outline" style="padding:2px 10px;margin-top:4px" onclick="readWakeDiag()">Read wake diagnostics</button>
      <div id="wakediag" style="font-size:12px;margin-top:6px">Nothing read yet.</div>
    </div></div>` : '') + `
  `;
  app.innerHTML=html;
  // Only sweep the slots when their list is actually on screen. render() runs on
  // every tab switch and on some dropdown changes, and the sweep costs one HID
  // round-trip per slot (~60 ms each), so refreshing it from a tab that doesn't
  // show it was over a second of pointless traffic per re-render. Explicit
  // callers (save, activate, delete) still refresh directly.
  if ((window._tab || 'triggers') === 'slots') refreshSlots();
  // render() rebuilds the whole page, so the dynamic panels revert to their
  // placeholders while their data still exists in memory. Repopulate them, or the
  // builder shows an empty list yet still rejects a stage as a duplicate zone.
  try { if (typeof cebRender === 'function') cebRender(); } catch(e){}
  try { if (typeof cebShowLevels === 'function') cebShowLevels(); } catch(e){}
}

render();
portalSelfCheck();

// --- Automation entry point (for AHK / Playnite) ---------------------------
// Opening the portal with ?autoapply=<base64-json>[&autosave=1] will:
//   1. silently reconnect to an already-granted device (no picker — WebHID allows
//      getDevices() without a gesture once the user has granted access once),
//   2. apply the profile encoded in the URL,
//   3. optionally Save to Device automatically.
// This lets a one-line AHK script (which just launches a URL) drive the whole
// config, avoiding fragile dialog-clicking. First-time setup still needs one
// manual Connect so the browser grants HID access to this origin.
// EMBEDDED_PROFILE: when this file is generated per-profile (see
// make-autoapply-html.py), the profile JSON is stamped in here and auto-applies
// the moment the page opens — no URL parameters needed, just open the file.
// Left null in the master portal (which behaves normally / uses URL params).
const EMBEDDED_PROFILE = null; /*EMBED_PROFILE_HOOK*/
const EMBEDDED_AUTOSAVE = true; /*EMBED_AUTOSAVE_HOOK*/

async function autoApply(){
  const params = new URLSearchParams(location.search);
  const enc = params.get('autoapply');
  // Source priority: an embedded profile (generated per-file) wins; else URL param.
  let json = null, profileName = null, autosave = false;
  if (EMBEDDED_PROFILE){
    json = EMBEDDED_PROFILE;
    profileName = (EMBEDDED_PROFILE && EMBEDDED_PROFILE.name) || 'embedded profile';
    autosave = EMBEDDED_AUTOSAVE;
  } else if (enc){
    try { json = JSON.parse(decodeURIComponent(escape(atob(enc)))); }
    catch(e){ try { json = JSON.parse(atob(enc)); } catch(_){ json = null; } }
    profileName = params.get('profile');
    autosave = params.get('autosave')==='1';
  }
  if (!json) return; // normal portal usage, no auto-apply

  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:14px;'
    + 'background:#1e293b;color:#e2e8f0;font:15px system-ui;text-align:center;z-index:9999';
  document.body.appendChild(banner);

  // The actual apply routine, usable both for silent auto-run and for a click.
  async function doApply(viaGesture){
    try {
      banner.textContent = 'Auto-apply: connecting…';
      banner.style.background = '#1e293b';
      let devs = await navigator.hid.getDevices();
      let d = pickDs5(devs);
      // If not already granted, a gesture lets us prompt the picker directly.
      if (!d && viaGesture){
        const picked = await navigator.hid.requestDevice({ filters: [
          {vendorId:SONY_VID, productId:DS5_PID}, {vendorId:SONY_VID, productId:DSE_PID} ]});
        d = picked && (pickDs5(picked) || picked[0]);
      }
      if (!d){
        showConnectButton('No granted device yet — click to connect and apply.');
        return;
      }
      device = d;
      if (!device.opened) await device.open();
      await sleep(300);
      await readAll();

      const settings = (json && typeof json.settings==='object') ? json.settings : json;
      const known = new Set(FIELDS.map(f=>f[1]));
      let applied=0;
      for (const k of Object.keys(settings)){ if(known.has(k)){ config[k]=settings[k]; applied++; } }
      if (json && json.effects){
        try { await writeEffectsToDevice(json.effects); } catch(e){ /* settings still apply */ }
      }
      render();
      banner.textContent = `Loaded ${applied} setting(s)` + (profileName?` from "${profileName}"`:'');

      if (autosave){
        banner.textContent += ' — saving…';
        await saveAll();
        banner.textContent = `"${profileName||'profile'}" saved to device ✓`;
        banner.style.background = '#14532d';
        // AUTOCLOSE: applied OK - close this tab so profile pages don't pile up.
        // A tab opened by the automation has a single history entry, which makes
        // it script-closable. Gated to embedded profiles (or ?autoclose=1) so the
        // master portal / manual use never closes itself; failure paths keep the
        // page open so errors stay visible.
        if (EMBEDDED_PROFILE || params.get('autoclose')==='1'){
          setTimeout(()=>{ try { window.close(); } catch(_){} }, 1200);
        }
      } else {
        banner.textContent += ' — click Save to Device to apply.';
      }
      setTimeout(()=>banner.remove(), 4000);
    } catch(e){
      showConnectButton('Auto-apply hit an error (' + e.message + ') — click to retry.');
    }
  }

  function showConnectButton(msg){
    // Surface the wait in the taskbar: the automation opens this window
    // minimized, so a silent "click to connect" state would be invisible.
    document.title = 'CONNECT NEEDED - DS5 Bridge Config';
    banner.style.background = '#7c2d12';
    banner.innerHTML = '';
    const span = document.createElement('span'); span.textContent = msg + '  ';
    const btn = document.createElement('button');
    btn.textContent = 'Connect & Apply';
    btn.style.cssText = 'padding:6px 14px;margin-left:8px;border-radius:6px;border:0;'
      + 'background:#22c55e;color:#052e16;font-weight:600;cursor:pointer';
    btn.onclick = () => doApply(true);
    banner.appendChild(span); banner.appendChild(btn);
  }

  // Try a fully silent apply first. If the browser blocks the gesture-free
  // connect (some Chrome versions require a click to reopen a granted device),
  // the catch/no-device path shows the one-click button instead — so the file
  // always works, best case with zero clicks, worst case with one.
  try { await doApply(false); }
  catch(e){ showConnectButton('Click to connect and apply this profile.'); }
}
autoApply();
</script>
</body>
